<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labour Lekka - Free Offline Farm Labour Ledger & Attendance App</title>
    <meta name="description" content="Labour Lekka is an offline-first digital ledger for farmers and agricultural contractors to manage worker attendance (Hajari) and cash advances (Hisab-Kitab) with zero internet." />
    <meta name="theme-color" content="#708C69" />
    <meta property="og:title" content="Labour Lekka - Offline Farm Labour Ledger" />
    <meta property="og:description" content="Track daily attendance (Hajari) and cash advances (Hisab-Kitab) offline. Free ledger for farmers and contractors." />
    <meta property="og:image" content="logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://labourlekka.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Labour Lekka - Offline Farm Labour Ledger" />
    <meta name="twitter:description" content="Track daily attendance (Hajari) and cash advances (Hisab-Kitab) offline. Free ledger for farmers and contractors." />
    <meta name="twitter:image" content="logo.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(43, 62, 52, 0.85) 0%, rgba(112, 140, 105, 0.9) 100%),
                        url('bg-placeholder.png') center/cover, #FCF3E3;
            background-attachment: fixed;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            padding: 48px 32px 40px 32px;
            border-radius: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(43, 62, 52, 0.25);
        }

        .app-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            color: #2B3E34;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 18px;
            color: #5E7757;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .download-btn img {
            height: 64px;
            width: auto;
        }

        .links-container {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer-link {
            color: #5E7757;
            font-size: 14px;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s, color 0.2s;
            cursor: pointer;
        }

        .footer-link:hover {
            color: #2B3E34;
            border-bottom-color: #2B3E34;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 32px;
            }

            .tagline {
                font-size: 16px;
            }

            .app-icon {
                width: 80px;
                height: 80px;
                margin-bottom: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="container" role="main" aria-label="Labour Lekka landing section">
        <div class="app-icon">
            <img src="logo.png" alt="Labour Lekka app logo" width="100" height="100" />
        </div>
        <h1 id="main-title">Labour Lekka</h1>
        <p class="tagline">Your Farm's Offline Labour Ledger.<br>Simple attendance, advances, and accounts.</p>
        
        <a href="https://play.google.com/store/apps/details?id=com.nmd.labourlekka" target="_blank" rel="noopener noreferrer" class="download-btn" id="downloadBtn" aria-label="Download Labour Lekka on Google Play" tabindex="0">
            <img src="google-play-badge.svg" alt="Get it on Google Play badge" />
        </a>
        
        <div class="links-container">
            <a href="/privacy-policy.html" class="footer-link" aria-label="View privacy policy">Privacy Policy</a>
            <a href="/data-deletion.html" class="footer-link" aria-label="View data deletion guide">Data Deletion Guide</a>
        </div>
    </main>
</body>
</html>
