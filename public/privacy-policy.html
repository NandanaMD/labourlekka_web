<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Privacy Policy - Labour Lekka</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .policy-markdown {
      color: #3a3a30;
      line-height: 1.625;
      font-size: 1rem;
    }

    .policy-surface {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #e7e1cf;
      border-radius: 1rem;
      box-shadow: 0 12px 30px rgba(28, 58, 43, 0.06);
      padding: 2rem;
    }

    .policy-markdown h1,
    .policy-markdown h2,
    .policy-markdown h3 {
      color: #1c3a2b;
      font-weight: 700;
      line-height: 1.3;
    }

    .policy-markdown h1 {
      font-size: 1.875rem;
      margin: 0 0 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #e7e1cf;
    }

    .policy-markdown h2 {
      font-size: 1.5rem;
      margin: 2rem 0 0.75rem;
    }

    .policy-markdown h3 {
      font-size: 1.25rem;
      margin: 1.5rem 0 0.5rem;
    }

    .policy-markdown p {
      margin: 1rem 0;
    }

    .policy-markdown ul {
      list-style-type: disc;
      margin: 1rem 0;
      padding-left: 2rem;
    }

    .policy-markdown ol {
      list-style-type: decimal;
      margin: 1rem 0;
      padding-left: 2rem;
    }

    .policy-markdown ul ul {
      list-style-type: circle;
    }

    .policy-markdown ul ul ul {
      list-style-type: square;
    }

    .policy-markdown li {
      display: list-item;
      margin: 0.5rem 0;
    }

    .policy-markdown a {
      color: #4d7a44;
      text-decoration: none;
    }

    .policy-markdown a:hover {
      text-decoration: underline;
    }

    .policy-markdown strong {
      color: #1c3a2b;
      font-weight: 600;
    }

    .policy-markdown code {
      background: #f0ecdf;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.9em;
    }

    .policy-markdown blockquote {
      border-left: 4px solid #7a9b6f;
      margin: 1rem 0;
      padding-left: 1rem;
      color: #6b7a63;
      font-style: italic;
    }

    .policy-markdown hr {
      margin: 2rem 0;
      border: none;
      border-top: 1px solid #e7e1cf;
    }

    .policy-markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .policy-markdown th,
    .policy-markdown td {
      border: 1px solid #e7e1cf;
      padding: 0.75rem;
      text-align: left;
    }

    .policy-markdown th {
      background: #f4f0e4;
      font-weight: 600;
    }
  </style>
</head>

<body class="min-h-screen bg-[#faf6e9]">

  <!-- Header -->
  <header class="sticky top-0 z-10 border-b border-[#e7e1cf] bg-white">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">

      <!-- Back -->
      <a href="/"
        class="flex items-center gap-2 text-[#1c3a2b] hover:text-[#7a9b6f] transition-colors">

        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>

        <span class="font-medium">Back</span>
      </a>

      <!-- Logo -->
      <div class="flex items-center gap-2.5">
        <img src="logo.png" alt="Labour Lekka" class="h-8 w-8 rounded-md object-contain">

        <span class="font-bold text-[#1c3a2b]">
          Labour Lekka
        </span>
      </div>

    </div>
  </header>

  <!-- Main -->
  <main class="max-w-3xl mx-auto px-6 py-14">
    <div class="mb-10">
      <h1 class="mb-4 text-4xl font-extrabold tracking-tight text-[#1c3a2b] md:text-5xl">
          Privacy Policy
      </h1>
      <div class="flex flex-wrap gap-x-6 gap-y-1 text-sm text-[#6b7a63]">
        <span>Effective: December 30, 2025</span>
        <span>Last updated: September 26, 2026</span>
      </div>
    </div>

    <section class="policy-surface">
      <!-- Loader -->
      <div id="loading" class="flex items-center justify-center py-24">
        <div class="text-center">
          <div class="mx-auto mb-4 h-10 w-10 animate-spin rounded-full border-2 border-[#e7e1cf] border-t-[#1c3a2b]"></div>
          <p class="text-sm text-[#6b7a63]">Loading privacy policy...</p>
        </div>
      </div>

      <!-- Markdown -->
      <article id="policy-content" class="policy-markdown hidden max-w-none"></article>
    </section>

    <!-- Footer -->
    <div class="mt-14 border-t border-[#e7e1cf] pt-8">
      <a href="/"
        class="inline-flex items-center gap-2 rounded-full bg-[#1c3a2b] px-6 py-3 font-semibold text-white transition-colors hover:bg-[#2a4d3a]">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7 7-7m-7 7h18" />
        </svg>
        Back to Home
      </a>
    </div>
  </main>

  <script>
    async function loadPrivacyPolicy() {

      const loading = document.getElementById("loading");
      const content = document.getElementById("policy-content");

      try {

        const response = await fetch("/PRIVACY_POLICY.md");

        if (!response.ok) {
          throw new Error("Unable to load privacy policy.");
        }

        marked.setOptions({
          gfm: true,
          breaks: true
        });

        const markdown = await response.text();

        content.innerHTML = marked.parse(markdown);

        loading.remove();

        content.classList.remove("hidden");

      } catch (error) {

        loading.innerHTML = `
          <div class="text-center">
            <p class="text-red-600 font-semibold mb-2">
              Failed to load the Privacy Policy.
            </p>

            <p class="text-slate-500 text-sm">
              Please refresh the page and try again.
            </p>
          </div>
        `;

        console.error(error);
      }

    }

    loadPrivacyPolicy();
  </script>

</body>

</html>
