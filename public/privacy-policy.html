<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Privacy Policy - Labour Lekka</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .policy-markdown {
      color: #1e293b;
      line-height: 1.8;
      font-size: 0.95rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }

    /* Headings */

    .policy-markdown h1,
    .policy-markdown h2,
    .policy-markdown h3 {
      color: #0f172a;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.015em;
    }

    .policy-markdown h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid #e2e8f0;
    }

    .policy-markdown h2 {
      font-size: 1.3rem;
      color: #0f766e;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }

    .policy-markdown h3 {
      font-size: 1.05rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    /* Paragraphs */

    .policy-markdown p {
      margin: 0.9rem 0;
      color: #334155;
      text-align: justify;
    }

    /* Lists */

    .policy-markdown ul {
      list-style-type: disc;
      margin: 1rem 0;
      padding-left: 2rem;
    }

    .policy-markdown ol {
      list-style-type: decimal;
      margin: 1rem 0;
      padding-left: 2rem;
    }

    /* Nested lists */

    .policy-markdown ul ul {
      list-style-type: circle;
    }

    .policy-markdown ul ul ul {
      list-style-type: square;
    }

    .policy-markdown li {
      display: list-item;
      margin: 0.45rem 0;
      color: #475569;
    }

    /* Links */

    .policy-markdown a {
      color: #0284c7;
      text-decoration: underline;
    }

    /* Bold */

    .policy-markdown strong {
      color: #0f172a;
      font-weight: 600;
    }

    /* Inline code */

    .policy-markdown code {
      background: #f1f5f9;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.9em;
    }

    /* Blockquotes */

    .policy-markdown blockquote {
      border-left: 4px solid #cbd5e1;
      margin: 1rem 0;
      padding-left: 1rem;
      color: #475569;
      font-style: italic;
    }

    /* Horizontal rule */

    .policy-markdown hr {
      margin: 2rem 0;
      border: none;
      border-top: 1px solid #e2e8f0;
    }

    /* Tables (GitHub Markdown) */

    .policy-markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .policy-markdown th,
    .policy-markdown td {
      border: 1px solid #e2e8f0;
      padding: 0.75rem;
      text-align: left;
    }

    .policy-markdown th {
      background: #f8fafc;
      font-weight: 600;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">

  <!-- Header -->
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white shadow-sm">
    <div class="max-w-5xl mx-auto grid grid-cols-3 items-center px-4 py-4">

      <!-- Back -->
      <a href="/"
        class="justify-self-start flex items-center gap-2 text-slate-700 hover:text-slate-900 transition-colors">

        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>

        <span class="font-medium">Back</span>
      </a>

      <!-- Logo -->
      <div class="justify-self-center flex items-center gap-3">
        <img src="logo.png" alt="Labour Lekka" class="h-8 w-8 rounded-md object-contain">

        <span class="font-semibold text-slate-900">
          Labour Lekka
        </span>
      </div>

      <!-- Empty column keeps logo centered -->
      <div></div>

    </div>
  </header>

  <!-- Main -->
  <main class="max-w-4xl mx-auto px-4 py-12">

    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg">

      <!-- Hero -->
      <div class="bg-gradient-to-r from-slate-900 to-slate-800 px-8 py-10 text-white">

        <h1 class="mb-3 text-4xl font-bold">
          Privacy Policy
        </h1>

        <div class="text-sm text-slate-300 space-x-4">
          <span>📅 Effective: December 30, 2025</span>
          <span>📝 Last Updated: July 19, 2026</span>
        </div>

      </div>

      <!-- Content -->
      <div class="p-8 md:p-12">

        <!-- Loader -->
        <div id="loading" class="flex justify-center items-center py-20">

          <div class="text-center">

            <div class="mx-auto mb-4 h-12 w-12 animate-spin rounded-full border-b-2 border-slate-900">
            </div>

            <p class="text-slate-600">
              Loading Privacy Policy...
            </p>

          </div>

        </div>

        <!-- Markdown -->
        <article id="policy-content" class="policy-markdown hidden">
        </article>

      </div>

    </section>

    <!-- Footer -->
    <div class="mt-8 text-center">

      <a href="/"
        class="inline-flex items-center rounded-lg bg-slate-900 px-8 py-3 text-white font-medium shadow-lg hover:bg-slate-800 transition-colors">

        Back to Home

      </a>

    </div>

  </main>

  <script>
    async function loadPrivacyPolicy() {

      const loading = document.getElementById("loading");
      const content = document.getElementById("policy-content");

      try {

        const response = await fetch("/PRIVACY_POLICY.md");

        if (!response.ok) {
          throw new Error("Unable to load privacy policy.");
        }

        marked.setOptions({
          gfm: true,
          breaks: true
        });

        const markdown = await response.text();

        content.innerHTML = marked.parse(markdown);

        loading.remove();

        content.classList.remove("hidden");

      } catch (error) {

        loading.innerHTML = `
          <div class="text-center">
            <p class="text-red-600 font-semibold mb-2">
              Failed to load the Privacy Policy.
            </p>

            <p class="text-slate-500 text-sm">
              Please refresh the page and try again.
            </p>
          </div>
        `;

        console.error(error);
      }

    }

    loadPrivacyPolicy();
  </script>

</body>

</html>
